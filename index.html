:root {
  --bg: #0a0a13;
  --surface: #11111d;
  --surface-2: #171726;
  --surface-3: #1e1e30;
  --border: #262640;
  --border-strong: #3a3a5e;
  --text: #eceaf6;
  --muted: #a6a6c4;
  --faint: #6d6d8c;
  --accent: #ec4899;
  --accent-2: #8b5cf6;
  --ok: #34d399;
  --warn: #fbbf24;
  --err: #f87171;
  --mono: ui-monospace, "Cascadia Code", "SF Mono", SFMono-Regular, Menlo, Consolas, "Liberation Mono", monospace;
}

@media (prefers-color-scheme: dark) {
  :root {
    --bg: #0a0a13;
    --surface: #11111d;
    --surface-2: #171726;
    --surface-3: #1e1e30;
    --border: #262640;
    --border-strong: #3a3a5e;
    --text: #eceaf6;
    --muted: #a6a6c4;
    --faint: #6d6d8c;
    --accent: #ec4899;
    --accent-2: #8b5cf6;
    --ok: #34d399;
    --warn: #fbbf24;
    --err: #f87171;
  }
}

html,
body {
  background: var(--bg);
}

body {
  font-family: var(--mono);
  -webkit-font-smoothing: antialiased;
  text-rendering: optimizeLegibility;
}

::-moz-selection {
  background: rgba(236, 72, 153, 0.35);
  color: #fff;
}

::selection {
  background: rgba(236, 72, 153, 0.35);
  color: #fff;
}

/* slim scrollbars for terminal + code blocks */

.term-scroll {
  scrollbar-width: thin;
  scrollbar-color: #34345a transparent;
}

.term-scroll::-webkit-scrollbar {
  width: 8px;
  height: 8px;
}

.term-scroll::-webkit-scrollbar-track {
  background: transparent;
}

.term-scroll::-webkit-scrollbar-thumb {
  background: #34345a;
  border-radius: 4px;
}

.term-scroll::-webkit-scrollbar-thumb:hover {
  background: #4a4a76;
}

@keyframes term-blink {
  0%, 100% {
    opacity: 1;
  }

  50% {
    opacity: 0;
  }
}

.term-cursor {
  animation: term-blink 1.1s steps(1) infinite;
}

@keyframes pulse-dot {
  0%, 100% {
    opacity: 1;
    transform: scale(1);
  }

  50% {
    opacity: 0.45;
    transform: scale(0.85);
  }
}

.pulse-dot {
  animation: pulse-dot 1.6s ease-in-out infinite;
}

@keyframes dropzone-glow {
  0%, 100% {
    box-shadow: 0 0 0 0 rgba(236, 72, 153, 0);
  }

  50% {
    box-shadow: 0 0 0 4px rgba(236, 72, 153, 0.35);
  }
}

.dropzone-alert {
  animation: dropzone-glow 0.6s ease-in-out 3;
  border-color: var(--err) !important;
}

.hover\:scale-\[1\.01\]:hover {
  --tw-scale-x: 1.01;
  --tw-scale-y: 1.01;
  transform: translate(var(--tw-translate-x), var(--tw-translate-y)) rotate(var(--tw-rotate)) skewX(var(--tw-skew-x)) skewY(var(--tw-skew-y)) scaleX(var(--tw-scale-x)) scaleY(var(--tw-scale-y));
}

.hover\:border-\[var\(--accent\)\]:hover {
  border-color: var(--accent);
}

.hover\:border-\[var\(--err\)\]:hover {
  border-color: var(--err);
}

.hover\:text-\[var\(--err\)\]:hover {
  color: var(--err);
}

.hover\:text-\[var\(--text\)\]:hover {
  color: var(--text);
}

.active\:scale-\[0\.99\]:active {
  --tw-scale-x: 0.99;
  --tw-scale-y: 0.99;
  transform: translate(var(--tw-translate-x), var(--tw-translate-y)) rotate(var(--tw-rotate)) skewX(var(--tw-skew-x)) skewY(var(--tw-skew-y)) scaleX(var(--tw-scale-x)) scaleY(var(--tw-scale-y));
}

.disabled\:cursor-not-allowed:disabled {
  cursor: not-allowed;
}

.disabled\:opacity-40:disabled {
  opacity: 0.4;
}

.disabled\:hover\:scale-100:hover:disabled {
  --tw-scale-x: 1;
  --tw-scale-y: 1;
  transform: translate(var(--tw-translate-x), var(--tw-translate-y)) rotate(var(--tw-rotate)) skewX(var(--tw-skew-x)) skewY(var(--tw-skew-y)) scaleX(var(--tw-scale-x)) scaleY(var(--tw-scale-y));
}

@media (min-width: 640px) {
  .sm\:block {
    display: block;
  }

  .sm\:hidden {
    display: none;
  }

  .sm\:max-w-\[260px\] {
    max-width: 260px;
  }

  .sm\:flex-row {
    flex-direction: row;
  }

  .sm\:p-4 {
    padding: 1rem;
  }

  .sm\:p-5 {
    padding: 1.25rem;
  }

  .sm\:px-6 {
    padding-left: 1.5rem;
    padding-right: 1.5rem;
  }

  .sm\:text-xl {
    font-size: 1.25rem;
    line-height: 1.75rem;
  }
}

@media (min-width: 1024px) {
  .lg\:sticky {
    position: sticky;
  }

  .lg\:top-6 {
    top: 1.5rem;
  }

  .lg\:h-\[560px\] {
    height: 560px;
  }

  .lg\:grid-cols-4 {
    grid-template-columns: repeat(4, minmax(0, 1fr));
  }

  .lg\:grid-cols-\[minmax\(0\2c 1fr\)_380px\] {
    grid-template-columns: minmax(0,1fr) 380px;
  }
}
