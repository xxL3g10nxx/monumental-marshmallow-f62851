:root {
  --bg: #050508;
  --surface: #141416;
  --surface-2: #1d1d22;
  --pink: #ec4899;
  --purple: #a855f7;
  --orange: #ff8c3a;
  --text: #f5f3f7;
  --muted: #a3a3b2;
  --safe-area-inset-top: env(safe-area-inset-top, 0px);
  --font: "Avenir Next", "Segoe UI", system-ui, -apple-system, sans-serif;
  --mono: "SF Mono", ui-monospace, Menlo, Consolas, monospace;
}

@media (prefers-color-scheme: dark) {
  :root {
    --bg: #050508;
    --surface: #141416;
    --surface-2: #1d1d22;
    --text: #f5f3f7;
    --muted: #a3a3b2;
  }
}

html, body {
  margin: 0;
  padding: 0;
  background: var(--bg);
  color: var(--text);
  font-family: var(--font);
  overscroll-behavior: none;
}

#app {
  position: fixed;
  inset: 0;
  box-sizing: border-box;
  padding-top: var(--safe-area-inset-top);
  overflow: hidden;
  background: var(--bg);
}

#app canvas.webgl {
  position: absolute;
  inset: 0;
  display: block;
  touch-action: none;
}

/* ---------- top bar ---------- */

.topbar {
  position: absolute;
  top: calc(var(--safe-area-inset-top) + 10px);
  left: 12px;
  right: 12px;
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 10px;
  flex-wrap: wrap;
  z-index: 20;
  pointer-events: none;
}

.topbar > * {
  pointer-events: auto;
}

.brand {
  display: flex;
  flex-direction: column;
  line-height: 1.1;
}

.brand h1 {
  margin: 0;
  font-size: 20px;
  font-weight: 800;
  letter-spacing: 0.14em;
  text-transform: uppercase;
  background: linear-gradient(90deg, var(--pink), var(--purple), var(--orange));
  -webkit-background-clip: text;
  background-clip: text;
  color: transparent;
}

.brand small {
  color: var(--muted);
  font-size: 11px;
  letter-spacing: 0.08em;
  font-family: var(--mono);
}

.top-actions {
  display: flex;
  gap: 8px;
  flex-wrap: wrap;
}

.btn {
  -webkit-appearance: none;
     -moz-appearance: none;
          appearance: none;
  border: 1px solid rgba(236, 72, 153, 0.55);
  background: rgba(20, 20, 22, 0.82);
  color: var(--text);
  font-family: var(--font);
  font-size: 13px;
  font-weight: 600;
  letter-spacing: 0.04em;
  padding: 9px 14px;
  border-radius: 999px;
  cursor: pointer;
  backdrop-filter: blur(6px);
  transition: transform 0.12s ease, box-shadow 0.12s ease, background 0.12s ease;
}

.btn:hover {
  background: rgba(236, 72, 153, 0.18);
  box-shadow: 0 0 18px rgba(236, 72, 153, 0.35);
  transform: translateY(-1px);
}

.btn:active {
  transform: translateY(1px) scale(0.98);
}

.btn.purple {
  border-color: rgba(168, 85, 247, 0.6);
}

.btn.purple:hover {
  background: rgba(168, 85, 247, 0.18);
  box-shadow: 0 0 18px rgba(168, 85, 247, 0.35);
}

/* ---------- VR button ---------- */

.vrbtn {
  position: fixed;
  right: 18px;
  bottom: 22px;
  z-index: 99999;
  display: none;
  border: none;
  cursor: pointer;
  font-family: var(--font);
  font-weight: 800;
  font-size: 15px;
  letter-spacing: 0.1em;
  text-transform: uppercase;
  color: #0b0b10;
  padding: 15px 26px;
  border-radius: 999px;
  background: linear-gradient(135deg, var(--pink), var(--purple));
  box-shadow: 0 0 26px rgba(236, 72, 153, 0.55);
  transition: transform 0.12s ease, box-shadow 0.12s ease;
}

.vrbtn:hover {
  transform: scale(1.05);
  box-shadow: 0 0 36px rgba(168, 85, 247, 0.7);
}

.vrbtn:active {
  transform: scale(0.97);
}

/* ---------- toast ---------- */

.toast {
  position: absolute;
  left: 14px;
  bottom: 20px;
  z-index: 30;
  max-width: min(78vw, 340px);
  background: rgba(20, 20, 24, 0.9);
  border: 1px solid rgba(168, 85, 247, 0.45);
  color: var(--text);
  font-size: 13px;
  padding: 10px 16px;
  border-radius: 12px;
  opacity: 0;
  transform: translateY(8px);
  transition: opacity 0.25s ease, transform 0.25s ease;
  pointer-events: none;
  backdrop-filter: blur(6px);
}

.toast.show {
  opacity: 1;
  transform: translateY(0);
}

/* ---------- detail panel ---------- */

.detail {
  position: absolute;
  top: calc(var(--safe-area-inset-top) + 64px);
  right: 12px;
  z-index: 40;
  width: min(320px, calc(100vw - 24px));
  background: rgba(18, 18, 22, 0.94);
  border: 1px solid rgba(236, 72, 153, 0.4);
  border-radius: 18px;
  padding: 18px;
  box-shadow: 0 12px 48px rgba(0, 0, 0, 0.6), 0 0 24px rgba(236, 72, 153, 0.15);
  opacity: 0;
  visibility: hidden;
  transform: translateX(24px);
  transition: transform 0.3s ease, opacity 0.3s ease, visibility 0s linear 0.3s;
  backdrop-filter: blur(10px);
}

.detail.open {
  opacity: 1;
  visibility: visible;
  transform: translateX(0);
  transition: transform 0.3s ease, opacity 0.3s ease;
}

.detail .d-head {
  display: flex;
  align-items: center;
  justify-content: space-between;
  margin-bottom: 10px;
}

.detail .d-user {
  font-weight: 700;
  font-size: 14px;
  color: var(--pink);
}

.detail .d-date {
  font-family: var(--mono);
  font-size: 11px;
  color: var(--muted);
}

.detail .d-cap {
  font-size: 14px;
  line-height: 1.55;
  color: var(--text);
  margin: 0 0 12px;
}

.detail .d-stats {
  display: flex;
  gap: 16px;
  font-size: 13px;
  color: var(--muted);
  margin-bottom: 14px;
  font-family: var(--mono);
}

.detail .d-stats b {
  color: var(--text);
}

.detail .d-close {
  border: none;
  background: none;
  color: var(--muted);
  font-size: 20px;
  cursor: pointer;
  line-height: 1;
  padding: 4px;
}

.detail .d-close:hover {
  color: var(--text);
}

/* ---------- flash overlay ---------- */

.flash {
  position: absolute;
  inset: 0;
  z-index: 60;
  background: #fff;
  opacity: 0;
  pointer-events: none;
  transition: opacity 0.45s ease;
}

.flash.on {
  opacity: 0.85;
  transition: opacity 0.05s ease;
}

.hint {
  position: absolute;
  left: 14px;
  bottom: 20px;
  z-index: 5;
  font-family: var(--mono);
  font-size: 11px;
  color: rgba(163, 163, 178, 0.75);
  letter-spacing: 0.05em;
  pointer-events: none;
